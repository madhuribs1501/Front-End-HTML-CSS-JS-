<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Listing</title>
</head>
<body>
    <ol start = "10" reversed>
        <li>Madhuri</li>
        <li>Mritunjay</li>
        <li>Sharma ji</li>
    </ol>

        <li>Madhuri</li>

        <li>Sharma ji</li>
    </ul>
</body>
</html>
