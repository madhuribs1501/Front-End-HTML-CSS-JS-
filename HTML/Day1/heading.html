<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading tags</title>
</head>
<body>
    <!-- h1 heading has highest priority
     h6 has lowest priority -->
    <h1>Madhuri</h1>
    <h2>Madhuri</h2>
    <h3>Madhuri</h3>
    <h4>Madhuri</h4>
    <h5>Madhuri</h5>
    <h6>Madhuri</h6>
</body>
</html>
